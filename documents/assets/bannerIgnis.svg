<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="titulo">
  <title id="titulo">Olá, sejam bem-vindos ao nosso projeto! Leia nossa documentação e conheça o Ignis!</title>
  <defs>
    <pattern id="pontos" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.2" fill="#15294a"/>
    </pattern>
    <radialGradient id="brilho" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0c1e3d"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </radialGradient>
    <filter id="neon" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="corte1"><rect x="175" y="80" height="60" width="0">
      <animate attributeName="width" dur="8s" repeatCount="indefinite" values="0;850;850;0;0" keyTimes="0;0.1875;0.465;0.5;1"/>
    </rect></clipPath>
    <clipPath id="corte2"><rect x="142" y="80" height="60" width="0">
      <animate attributeName="width" dur="8s" repeatCount="indefinite" values="0;0;916;916;0" keyTimes="0;0.5;0.6875;0.965;1"/>
    </rect></clipPath>
  </defs>

  <rect x="10" y="10" width="1180" height="228" rx="30" fill="#081226" stroke="#1e4f9c" stroke-width="2.5" opacity="0.95"/>
  <rect x="30" y="28" width="1140" height="160" rx="18" fill="url(#brilho)" stroke="#1e4f9c" stroke-width="2"/>
  <rect x="30" y="28" width="1140" height="160" rx="18" fill="url(#pontos)"/>

  <circle cx="70" cy="108" r="6" fill="#f5b83d">
    <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.35;1"/>
  </circle>
  <circle cx="1130" cy="108" r="6" fill="#f5b83d">
    <animate attributeName="opacity" dur="2s" begin="1s" repeatCount="indefinite" values="1;0.35;1"/>
  </circle>

  <g font-family="'Courier New', Courier, monospace" font-size="36" font-weight="bold" fill="#4f86d9" text-anchor="middle" filter="url(#neon)">
    <text x="600" y="121" clip-path="url(#corte1)">Olá, sejam bem-vindos ao nosso projeto!</text>
    <text x="600" y="121" clip-path="url(#corte2)">Leia nossa documentação e conheça o Ignis!</text>
  </g>

  <g fill="#4f86d9">
    <rect x="175" y="88" width="3" height="40" opacity="0">
      <animate attributeName="x" dur="8s" repeatCount="indefinite" values="175;1025;1025;175;175" keyTimes="0;0.1875;0.465;0.5;1"/>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.5"/>
    </rect>
    <rect x="142" y="88" width="3" height="40" opacity="0">
      <animate attributeName="x" dur="8s" repeatCount="indefinite" values="142;142;1058;1058;142" keyTimes="0;0.5;0.6875;0.965;1"/>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.5"/>
    </rect>
  </g>

  <text x="600" y="220" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e4f9c" text-anchor="middle">Projeto Ignis · Os CALORos</text>
</svg>
